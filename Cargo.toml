[workspace]
resolver = "2"
members = [
    "crates/alive-core",
    "crates/alive-perception",
    "crates/alive-temporal",
    "crates/alive-track",
    "crates/alive-sign",
    "crates/alive-intent",
    "crates/alive-act",
    "crates/alive-journal",
    "crates/alive-ipc",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
alive-core = { path = "crates/alive-core" }
alive-journal = { path = "crates/alive-journal" }
alive-temporal = { path = "crates/alive-temporal" }
alive-track = { path = "crates/alive-track" }
alive-sign = { path = "crates/alive-sign" }
alive-intent = { path = "crates/alive-intent" }
alive-act = { path = "crates/alive-act" }
alive-ipc = { path = "crates/alive-ipc" }
alive-perception = { path = "crates/alive-perception" }
